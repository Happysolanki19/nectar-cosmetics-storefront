<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart | Nectar Cosmetics</title>
<link rel="stylesheet" href="style.css">
<style>
.cart-page{min-height:calc(100vh - 76px);background:#f1f2f6;padding:1px 0}
.cart-wrap{max-width:960px;margin:42px auto;padding:28px 30px 32px;border:1px solid #e1e3e8;border-radius:10px;background:#fff;box-shadow:0 4px 18px rgba(33,33,33,.045)}
.cart-wrap h1{color:#212121;margin-bottom:8px;font-family:Georgia,'Times New Roman',serif;font-weight:500}
.cart-intro{color:#666b73;margin-bottom:26px}
.cart-list{border-top:1px solid #e1e3e8}
.cart-item{display:grid;grid-template-columns:88px 1fr auto auto;align-items:center;gap:18px;padding:18px 0;border-bottom:1px solid #e1e3e8}
.cart-item img{width:88px;height:88px;object-fit:contain;border:1px solid #eceef2;border-radius:7px;background:#f8f9fb}
.cart-product-placeholder{width:88px;height:88px;display:grid;place-items:center;border:1px solid #eceef2;border-radius:7px;background:#f8f9fb;font-size:28px}
.cart-item h2{font-size:16px;color:#212121;margin:0 0 5px}
.cart-item p{margin:0;color:#50555d;font-weight:600}
.cart-quantity{width:76px;padding:8px;border:1px solid #c8cdd5;border-radius:5px;background:#fff;color:#212121;font:inherit}
.cart-quantity:focus{border-color:#2874f0;outline:2px solid #d9e7ff}
.remove-item{padding:8px 12px;border:1px solid #d7dce4;border-radius:5px;background:#fff;color:#555e6a;cursor:pointer;font-weight:600}
.remove-item:hover{border-color:#c64545;color:#a52e2e}
.cart-empty{padding:28px 0;color:#666b73}
.cart-summary{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px 0 4px}
.cart-total{font-size:20px;font-weight:700;color:#212121}
.cart-actions{display:flex;gap:12px;flex-wrap:wrap}
.cart-actions a{text-decoration:none;text-align:center}
.cart-actions .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:11px 18px;border-radius:6px;font-weight:700}
.cart-actions .btn-secondary{border:1px solid #2874f0;background:#fff;color:#2874f0}
.cart-actions .btn-secondary:hover{background:#edf4ff}
.cart-actions .btn-primary{border:1px solid #ffe500;background:#ffe500;color:#212121}
.cart-actions .btn-primary:hover{border-color:#ffca28;background:#ffca28}
.cart-actions .btn[aria-disabled="true"]{opacity:.55;pointer-events:none}
header{background:#2874f0;box-shadow:0 4px 14px rgba(21,87,192,.18)}
header.scrolled{background:#2874f0}
header .logo{color:#fff}
header nav a{color:#fff}
header nav a:hover,header nav a.active{color:#ffe500}
header nav a::after{background:#ffe500}
header .menu-toggle span{background:#fff}
header nav a[aria-current="page"]{color:#ffe500}
header nav a#cartCount{color:#212121}
@media(max-width:620px){
    .cart-page{min-height:calc(100vh - 66px)}
    header nav{display:none;right:0;transform:none;transition:none;background:#fff}
    header nav.open{display:flex;right:0;transform:none}
    header nav a{color:#212121}
    header nav a:hover,header nav a.active,header nav a[aria-current="page"]{color:#2874f0}
    .cart-wrap{margin:20px 12px;padding:21px 16px 23px}
    .cart-item{grid-template-columns:64px minmax(0,1fr) auto;gap:11px;padding:15px 0}
    .cart-item img{width:64px;height:64px}
    .cart-product-placeholder{width:64px;height:64px}
    .cart-item h2{font-size:14px;line-height:1.4}
    .cart-item p{font-size:13px}
    .cart-quantity{width:58px}
    .cart-item .remove-item{grid-column:2 / 4;justify-self:start}
    .cart-summary{align-items:flex-start;flex-direction:column}
    .cart-actions{width:100%}
    .cart-actions a{flex:1}
}
</style>
</head>
<body>
<header>
    <div class="logo">Nectar Cosmetics</div>
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
    </button>
    <nav id="navMenu">
        <a href="Home.html">Home</a>
        <a href="shopepage.html">Shop</a>
        <a href="shopepage.html#products">Products</a>
        <a href="cart.html" aria-current="page">Cart <span id="cartCount">0</span></a>
        <a href="login.html">Login</a>
        <a href="Registration%20.html">Register</a>
    </nav>
</header>
<main class="cart-page">
<section class="cart-wrap">
    <h1>Your Cart</h1>
    <p class="cart-intro">Review your items and quantities before checkout.</p>
    <div class="cart-list" id="cartItems" aria-live="polite"></div>
    <div class="cart-summary">
        <p class="cart-total">Total: <span id="cartTotal">₹0</span></p>
        <div class="cart-actions">
            <a class="btn btn-secondary" href="shopepage.html">Continue shopping</a>
            <a class="btn btn-primary" id="checkoutLink" href="checkout.htlm.html">Checkout</a>
        </div>
    </div>
</section>
</main>
<script>
    const cartStorageKey = 'nectarCart';
    const cartItems = document.getElementById('cartItems');
    const cartTotal = document.getElementById('cartTotal');
    const checkoutLink = document.getElementById('checkoutLink');
    const checkoutSourceKey = 'nectarCheckoutSource';

    function readCart() {
        try {
            const cart = JSON.parse(localStorage.getItem(cartStorageKey) || '[]');
            return Array.isArray(cart) ? cart : [];
        } catch {
            return [];
        }
    }

    function formatPrice(amount) {
        return `₹${new Intl.NumberFormat('en-IN').format(amount)}`;
    }

    checkoutLink.addEventListener('click', () => {
        if (readCart().length === 0) return;
        sessionStorage.removeItem('nectarBuyNow');
        sessionStorage.setItem(checkoutSourceKey, 'cart');
    });

    function renderCart() {
        const cart = readCart();
        const count = cart.reduce((total, item) => total + item.quantity, 0);
        document.getElementById('cartCount').textContent = count;
        cartItems.replaceChildren();

        if (cart.length === 0) {
            const emptyMessage = document.createElement('p');
            emptyMessage.className = 'cart-empty';
            emptyMessage.textContent = 'Your cart is empty.';
            cartItems.append(emptyMessage);
            cartTotal.textContent = formatPrice(0);
            checkoutLink.setAttribute('aria-disabled', 'true');
            checkoutLink.href = 'shopepage.html';
            return;
        }

        checkoutLink.removeAttribute('aria-disabled');
        checkoutLink.href = 'checkout.htlm.html';
        let total = 0;

        cart.forEach(item => {
            total += item.price * item.quantity;
            const row = document.createElement('div');
            row.className = 'cart-item';

            const details = document.createElement('div');
            const name = document.createElement('h2');
            name.textContent = item.name;
            const price = document.createElement('p');
            price.textContent = formatPrice(item.price);
            details.append(name, price);

            const quantity = document.createElement('input');
            quantity.className = 'cart-quantity';
            quantity.type = 'number';
            quantity.min = '1';
            quantity.step = '1';
            quantity.value = item.quantity;
            quantity.setAttribute('aria-label', `${item.name} quantity`);
            quantity.addEventListener('change', () => {
                const updatedCart = readCart();
                const updatedItem = updatedCart.find(cartItem => cartItem.id === item.id);
                if (updatedItem) updatedItem.quantity = Math.max(1, Number(quantity.value) || 1);
                localStorage.setItem(cartStorageKey, JSON.stringify(updatedCart));
                renderCart();
            });

            const remove = document.createElement('button');
            remove.className = 'remove-item';
            remove.type = 'button';
            remove.textContent = 'Remove';
            remove.addEventListener('click', () => {
                const updatedCart = readCart().filter(cartItem => cartItem.id !== item.id);
                localStorage.setItem(cartStorageKey, JSON.stringify(updatedCart));
                renderCart();
            });

            if (item.image) {
                const image = document.createElement('img');
                image.src = item.image;
                image.alt = item.name;
                row.append(image);
            } else {
                const placeholder = document.createElement('div');
                placeholder.className = 'cart-product-placeholder';
                placeholder.setAttribute('aria-hidden', 'true');
                placeholder.textContent = '🛍️';
                row.append(placeholder);
            }
            row.append(details, quantity, remove);
            cartItems.append(row);
        });

        cartTotal.textContent = formatPrice(total);
    }

    renderCart();

</script>
<script src="app.js" defer></script>
</body>
</html>
